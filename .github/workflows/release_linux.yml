# .github/workflows/release_linux.yml
name: Release Linux

on:
  push:
    branches:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from VERSION
        id: read_version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify branch matches version
        run: |
          BRANCH="${{ github.ref_name }}"
          VERSION="v${{ steps.read_version.outputs.version }}"
          if [ "$BRANCH" != "$VERSION" ]; then
            echo "Branch name '$BRANCH' does not match VERSION '$VERSION'"
            exit 1
          fi

      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG="v${{ steps.read_version.outputs.version }}"
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install build dependencies
        if: steps.check_tag.outputs.exists == 'false'
        run: sudo apt-get install -y build-essential cmake dpkg-dev

      - name: Build Linux binary
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          chmod +x scripts/linux/build.sh
          scripts/linux/build.sh

      - name: Build Debian package
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          chmod +x scripts/linux/build_debian.sh
          scripts/linux/build_debian.sh

      - name: Create tag and GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.read_version.outputs.version }}
          name: v${{ steps.read_version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/betterconn
            dist/betterconn_${{ steps.read_version.outputs.version }}.deb